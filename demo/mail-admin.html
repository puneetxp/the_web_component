<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail admin demo</title>
  <style>
    body { margin: 0; padding: 24px 16px; background: #f1f5f9; font-family: system-ui, sans-serif; }
    main { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
    /* One look for the whole page: set once on a parent, every component follows. */
    main { --the-primary: #6d28d9; --the-radius: 14px; }
  </style>
</head>
<body>
<main id="app" data-the-theme="light">
  <h1 style="margin:0;font-size:20px">Mail admin: all components on one page (fake backend)</h1>
  <the-mail-templates
    id="tpl"
    endpoint="/api/isuper/email-template/campaign"
    ai-endpoint="/api/isuper/email/ai-template"
    test-endpoint="/api/isuper/mail/send-test"
    brand="INTAX Billing"
    site-url="https://intax.in"
    from="INTAX Billing <hello@intax.in>"
    accent="#6d28d9"
    theme="light"
    no-dark
  ></the-mail-templates>
  <the-mail-health compact theme="light" no-dark></the-mail-health>
  <the-mail-health theme="light" no-dark></the-mail-health>
  <the-mail-accounts theme="light" no-dark></the-mail-accounts>
  <the-mail-schedules id="sch" theme="light" no-dark></the-mail-schedules>
  <the-mail-log theme="light" no-dark></the-mail-log>
  <the-template-studio theme="light" no-dark></the-template-studio>
</main>
<script src="./mock-backend.js"></script>
<script type="module">
  import "../src/index.ts";
  const app = document.getElementById("app");
  const sch = document.getElementById("sch");
  app.addEventListener("the-template-saved", () => sch.reload());
  app.addEventListener("the-template-deleted", () => sch.reload());
  app.addEventListener("the-schedule-template", (e) => {
    const d = e.detail || {};
    sch.openNewSchedule({ template: d.key, sourceType: d.sourceType });
    sch.scrollIntoView({ behavior: "smooth", block: "start" });
  });
</script>
</body>
</html>
